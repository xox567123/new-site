<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Idle Breakout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #050816;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050816;
      color: white;
      font-size: 1.2rem;
      z-index: 2;
    }

    .error-message {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #050816;
      color: white;
      text-align: center;
      z-index: 3;
    }

    .error-message div {
      max-width: 600px;
    }

    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="loading" id="loading">
      Loading Idle Breakout...
    </div>

    <!-- Replace this URL if you have a different online Idle Breakout game URL -->
    <iframe
      id="gameFrame"
      src="https://idle-breakout.github.io/"
      title="Online Idle Breakout"
      allowfullscreen
      allow="fullscreen; autoplay; gamepad">
    </iframe>

    <div class="error-message" id="errorMessage">
      <div>
        <h2>Idle Breakout could not be loaded</h2>
        <p>
          The game may block embedding on other websites.
          You can open it directly here:
        </p>
        <p>
          <a href="https://idle-breakout.github.io/" target="_blank">
            Open Idle Breakout
          </a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const gameFrame = document.getElementById("gameFrame");
    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("errorMessage");

    let loaded = false;

    gameFrame.addEventListener("load", () => {
      loaded = true;
      loading.style.display = "none";
    });

    setTimeout(() => {
      if (!loaded) {
        loading.style.display = "none";
        errorMessage.style.display = "flex";
      }
    }, 10000);
  </script>
</body>
</html>
