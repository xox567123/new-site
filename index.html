<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meteor Dash</title>
  <style>
    * {
      box-sizing: border-box;
    }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at top, #172554 0%, #070b1a 45%, #02030a 100%);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.game-shell {
  width: min(94vw, 900px);
  text-align: center;
}

h1 {
  margin: 0 0 8px;
  color: #67e8f9;
  font-size: clamp(2rem, 6vw, 4rem);
  letter-spacing: 5px;
  text-shadow:
    0 0 8px #22d3ee,
    0 0 24px #0891b2;
}

.subtitle {
  margin: 0 0 14px;
  color: #c4b5fd;
  font-size: 0.95rem;
}

.hud {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  padding: 12px 16px;
  border: 1px solid #334155;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.85);
  box-shadow: 0 0 20px rgba(34, 211, 238, 0.12);
  font-weight: bold;
}

.hud span {
  color: #facc15;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  border: 2px solid #22d3ee;
  border-radius: 14px;
  background: #050816;
  box-shadow:
    0 0 15px #0891b2,
    inset 0 0 35px rgba(59, 130, 246, 0.15);
}

.controls {
  margin-top: 12px;
  color: #cbd5e1;
  font-size: 0.9rem;
}

button {
  margin-top: 12px;
  padding: 10px 20px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #06b6d4, #8b5cf6);
  color: white;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(139, 92, 246, 0.55);
}

button:hover {
  transform: scale(1.04);
}

.message {
  min-height: 24px;
  margin-top: 10px;
  color: #fef08a;
  font-weight: bold;
}

  </style>
</head>
<body>
  <main class="game-shell">
    <h1>METEOR DASH</h1>
    <p class="subtitle">Survive the storm. Collect stars. Beat your high score.</p>
<div class="hud">
  <div>Score: <span id="score">0</span></div>
  <div>Lives: <span id="lives">3</span></div>
  <div>Level: <span id="level">1</span></div>
  <div>High Score: <span id="highScore">0</span></div>
</div>

<canvas id="gameCanvas" width="900" height="560"></canvas>

<div class="controls">
  Move with <strong>Arrow Keys</strong> or <strong>WASD</strong> • Collect yellow stars • Avoid meteors
</div>

<button id="restartButton">Restart Game</button>
<div class="message" id="message">Press an arrow key or WASD to start</div>

  </main>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");
    const levelElement = document.getElementById("level");
    const highScoreElement = document.getElementById("highScore");
    const messageElement = document.getElementById("message");
    const restartButton = document.getElementById("restartButton");

    const keys = {};
    let animationId;
    let gameStarted = false;
    let gameOver = false;
    let score = 0;
    let lives = 3;
    let level = 1;
    let highScore = Number(localStorage.getItem("meteorDashHighScore")) || 0;

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 70,
      width: 34,
      height: 34,
      speed: 5.5,
      invincible: 0
    };

    let meteors = [];
    let stars = [];
    let particles = [];
    let backgroundStars = [];

    for (let i = 0; i < 100; i++) {
      backgroundStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.7 + 0.2
      });
    }

    function resetGame() {
      cancelAnimationFrame(animationId);

      score = 0;
      lives = 3;
      level = 1;
      gameStarted = false;
      gameOver = false;
      meteors = [];
      stars = [];
      particles = [];

      player.x = canvas.width / 2;
      player.y = canvas.height - 70;
      player.invincible = 0;

      updateHud();
      messageElement.textContent = "Press an arrow key or WASD to start";
      draw();
    }

    function startGame() {
      if (gameOver) {
        resetGame();
      }

      if (!gameStarted) {
        gameStarted = true;
        messageElement.textContent = "";
        gameLoop();
      }
    }

    function updateHud() {
      scoreElement.textContent = score;
      livesElement.textContent = lives;
      levelElement.textContent = level;
      highScoreElement.textContent = highScore;
    }

    function randomEdgePosition() {
      return {
        x: Math.random() * (canvas.width - 40) + 20,
        y: -50
      };
    }

    function spawnMeteor() {
      const position = randomEdgePosition();

      meteors.push({
        x: position.x,
        y: position.y,
        radius: Math.random() * 15 + 15,
        speed: Math.random() * 2.5 + 2 + level * 0.25,
        rotation: Math.random() * Math.PI,
        rotationSpeed: (Math.random() - 0.5) * 0.08
      });
    }

    function spawnStar() {
      stars.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -30,
        radius: 10,
        speed: Math.random() * 1.5 + 2,
        rotation: 0
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x,
          y,
          dx: (Math.random() - 0.5) * 7,
          dy: (Math.random() - 0.5) * 7,
          life: 35,
          color
        });
      }
    }

    function movePlayer() {
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
        player.x -= player.speed;
      }

      if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
        player.x += player.speed;
      }

      if (keys["ArrowUp"] || keys["w"] || keys["W"]) {
        player.y -= player.speed;
      }

      if (keys["ArrowDown"] || keys["s"] || keys["S"]) {
        player.y += player.speed;
      }

      player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));
      player.y = Math.max(player.height / 2, Math.min(canvas.height - player.height / 2, player.y));

      if (player.invincible > 0) {
        player.invincible--;
      }
    }

    function circleRectangleCollision(circle, rectangle) {
      const closestX = Math.max(
        rectangle.x - rectangle.width / 2,
        Math.min(circle.x, rectangle.x + rectangle.width / 2)
      );

      const closestY = Math.max(
        rectangle.y - rectangle.height / 2,
        Math.min(circle.y, rectangle.y + rectangle.height / 2)
      );

      const distanceX = circle.x - closestX;
      const distanceY = circle.y - closestY;

      return distanceX * distanceX + distanceY * distanceY <
        circle.radius * circle.radius;
    }

    function updateObjects() {
      const meteorRate = Math.max(18, 55 - level * 4);
      const starRate = Math.max(45, 110 - level * 5);

      if (Math.floor(score + Date.now() / 100) % meteorRate === 0) {
        if (meteors.length < 30) spawnMeteor();
      }

      if (Math.floor(score + Date.now() / 100) % starRate === 0) {
        if (stars.length < 8) spawnStar();
      }

      meteors.forEach(meteor => {
        meteor.y += meteor.speed;
        meteor.rotation += meteor.rotationSpeed;
      });

      stars.forEach(star => {
        star.y += star.speed;
        star.rotation += 0.08;
      });

      meteors = meteors.filter(meteor => meteor.y < canvas.height + 70);
      stars = stars.filter(star => star.y < canvas.height + 40);

      for (let i = meteors.length - 1; i >= 0; i--) {
        const meteor = meteors[i];

        if (
          player.invincible <= 0 &&
          circleRectangleCollision(
            { x: meteor.x, y: meteor.y, radius: meteor.radius },
            player
          )
        ) {
          meteors.splice(i, 1);
          lives--;
          player.invincible = 100;
          createExplosion(player.x, player.y, "#fb7185");

          if (lives <= 0) {
            endGame();
            return;
          }

          updateHud();
        }
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const star = stars[i];
        const distance = Math.hypot(player.x - star.x, player.y - star.y);

        if (distance < 30) {
          stars.splice(i, 1);
          score += 100;
          createExplosion(star.x, star.y, "#fde047");

          level = Math.floor(score / 500) + 1;

          if (score > highScore) {
            highScore = score;
            localStorage.setItem("meteorDashHighScore", highScore);
          }

          updateHud();
        }
      }

      particles.forEach(particle => {
        particle.x += particle.dx;
        particle.y += particle.dy;
        particle.life--;
      });

      particles = particles.filter(particle => particle.life > 0);

      backgroundStars.forEach(star => {
        star.y += star.speed;

        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#080b24");
      gradient.addColorStop(1, "#02030d");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      backgroundStars.forEach(star => {
        ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 500 + star.x) * 0.25;
        ctx.fillStyle = "#bfdbfe";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalAlpha = 1;
    }

    function drawPlayer() {
      if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) {
        return;
      }

      ctx.save();
      ctx.translate(player.x, player.y);

      ctx.shadowBlur = 20;
      ctx.shadowColor = "#22d3ee";

      ctx.fillStyle = "#22d3ee";
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(19, 17);
      ctx.lineTo(0, 10);
      ctx.lineTo(-19, 17);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#a5f3fc";
      ctx.beginPath();
      ctx.moveTo(0, -13);
      ctx.lineTo(8, 9);
      ctx.lineTo(0, 5);
      ctx.lineTo(-8, 9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.moveTo(-8, 15);
      ctx.lineTo(0, 28);
      ctx.lineTo(8, 15);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawMeteor(meteor) {
      ctx.save();
      ctx.translate(meteor.x, meteor.y);
      ctx.rotate(meteor.rotation);

      ctx.shadowBlur = 18;
      ctx.shadowColor = "#f43f5e";
      ctx.fillStyle = "#ef4444";

      ctx.beginPath();

      for (let i = 0; i < 9; i++) {
        const angle = (Math.PI * 2 * i) / 9;
        const radius = meteor.radius * (0.75 + Math.random() * 0.35);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#991b1b";
      ctx.beginPath();
      ctx.arc(-5, -4, 4, 0, Math.PI * 2);
      ctx.arc(7, 5, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawStar(star) {
      ctx.save();
      ctx.translate(star.x, star.y);
      ctx.rotate(star.rotation);

      ctx.shadowBlur = 20;
      ctx.shadowColor = "#fde047";
      ctx.fillStyle = "#fde047";

      ctx.beginPath();

      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + (Math.PI * i) / 5;
        const radius = i % 2 === 0 ? star.radius : star.radius * 0.4;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(particle => {
        ctx.globalAlpha = particle.life / 35;
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();

      meteors.forEach(drawMeteor);
      stars.forEach(drawStar);
      drawParticles();
      drawPlayer();

      if (!gameStarted && !gameOver) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.55)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#67e8f9";
        ctx.font = "bold 32px Arial";
        ctx.textAlign = "center";
        ctx.fillText("READY?", canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = "#e0f2fe";
        ctx.font = "18px Arial";
        ctx.fillText(
          "Use WASD or the arrow keys to begin",
          canvas.width / 2,
          canvas.height / 2 + 28
        );
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fb7185";
        ctx.font = "bold 46px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = "#fef08a";
        ctx.font = "22px Arial";
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);

        ctx.fillStyle = "#e0f2fe";
        ctx.font = "17px Arial";
        ctx.fillText(
          "Press Restart Game to play again",
          canvas.width / 2,
          canvas.height / 2 + 52
        );
      }
    }

    function gameLoop() {
      if (!gameStarted || gameOver) return;

      movePlayer();
      updateObjects();
      draw();

      animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameOver = true;
      gameStarted = false;
      messageElement.textContent = "Game over — restart when you're ready";
      updateHud();
      draw();
    }

    window.addEventListener("keydown", event => {
      keys[event.key] = true;

      if (
        ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)
      ) {
        event.preventDefault();
      }

      startGame();
    });

    window.addEventListener("keyup", event => {
      keys[event.key] = false;
    });

    restartButton.addEventListener("click", resetGame);

    highScoreElement.textContent = highScore;
    resetGame();
  </script>
</body>
</html>
