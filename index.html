<!DOCTYPE html>
<html>
<head>
    <title>Stickman Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #444;
            font-family: Arial, sans-serif;
        }


        #coinCounter, #healthBar {
            position: fixed;
            left: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }
        #coinCounter { top: 10px; }
        #healthBar { top: 45px; }


        #waveCounter {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }
/* SHOP BUTTON */
#shopButton {
    position: fixed;
    left: 10px;
    top: 130px;
    width: 120px;
    height: 35px;
    background: rgba(255,255,255,0.2);
    border: 2px solid white;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    text-align: center;
    line-height: 35px;
    cursor: pointer;
    user-select: none;
}


/* SHOP OVERLAY */
#shopOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.8);
    display: none;
    z-index: 99999;
}


/* SHOP BOX */
#shopBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    background: #111;
    border: 3px solid white;
    border-radius: 15px;
    padding: 20px;
    color: white;
    text-align: center;
}


/* TABS */
#shopTabs {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
}


.shopTab {
    padding: 10px 20px;
    border: 2px solid white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
    color: white;
}


.activeTab {
    background: white;
    color: black;
}


/* CONTENT */
.shopContent {
    display: block;
}


.hidden {
    display: none;
}


/* SHOP ITEMS (centered, vertical, spaced) */
.shopItem {
    width: 80%;
    margin: 12px auto;
    padding: 12px;
    background: rgba(255,255,255,0.15);
    border: 2px solid white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 20px;
    color: white;
    transition: background 0.2s;
}


.shopItem:hover {
    background: rgba(255,255,255,0.3);
}




/* ===========================
   SWORD MENU (unchanged)
=========================== */


#swordMenuButton {
    position: fixed;
    left: 10px;
    top: 85px;
    width: 120px;
    height: 35px;
    background: rgba(255,255,255,0.2);
    border: 2px solid white;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    text-align: center;
    line-height: 35px;
    cursor: pointer;
    user-select: none;
}


#swordMenuOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.7);
    display: none;
    z-index: 9999;
}


#swordMenuBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 350px;
    background: #222;
    border: 3px solid white;
    border-radius: 15px;
    padding: 20px;
    color: white;
    text-align: center;
}


.swordOption {
    width: 90%;
    margin: 10px auto;
    padding: 12px;
    background: rgba(255,255,255,0.15);
    border: 2px solid white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
}


.swordOption:hover {
    background: rgba(255,255,255,0.3);
}




/* ===========================
   REMOVED OLD SHOP BUTTONS
=========================== */
/* (All 3-column shop buttons deleted) */




/* ===========================
   WORLD + PLAYER (unchanged)
=========================== */


#ground {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 25vh;
    background: #6b4f2a;
    z-index: -2;
}


#grass {
    position: fixed;
    bottom: 25vh;
    left: 0;
    width: 100%;
    height: 10vh;
    background: #3fa63f;
    z-index: -1;
}


#stickman {
    position: absolute;
    width: 10px;
    height: 60px;
    background: white;
    transform-origin: center;
    transition: transform 0.18s ease-in-out;
}


#stickman::before {
    content: "";
    position: absolute;
    top: -22px;
    left: -10px;
    width: 30px;
    height: 30px;
    background: white;
    border-radius: 50%;
}


/* ARMOR 0 */
#armorPlate {
    position: absolute;
    width: 30px;
    height: 35px;
    background: #8b5a2b;
    border: 3px solid #5c3a1a;
    border-radius: 6px;
    top: 15px;
    left: -10px;
    display: none;
    z-index: 4;
}


/* ARMOR 1 */
#armorPlate1 {
    position: absolute;
    width: 30px;
    height: 35px;
    background: linear-gradient(135deg,#d9d9d9,#bfbfbf,#e6e6e6,#a6a6a6);
    border: 3px solid #7a7a7a;
    border-radius: 6px;
    top: 15px;
    left: -10px;
    display: none;
    z-index: 5;
}


/* ARMOR 2 */
#armorPlate2 {
    position: absolute;
    width: 30px;
    height: 35px;
    background: linear-gradient(135deg,#00eaff,#00c8ff,#00aaff,#0088ff);
    border: 3px solid #005f99;
    border-radius: 6px;
    top: 15px;
    left: -10px;
    display: none;
    z-index: 6;
}


.arm {
    position: absolute;
    width: 12px;
    height: 35px;
    background: white;
    border-radius: 10px;
    top: 20px;
    transform-origin: top center;
    transition: transform 0.1s;
    z-index: 5;
}


#leftArm { left: -15px; transform: rotate(20deg); }
#rightArm { left: 13px; transform: rotate(-20deg); }


.leg {
    position: absolute;
    width: 8px;
    height: 40px;
    background: white;
    border-radius: 5px;
    top: 60px;
}


#leftLeg { left: -5px; }
#rightLeg { left: 10px; }


.sword {
    position: absolute;
    width: 8px;
    height: 45px;
    background: silver;
    border-radius: 4px;
    top: 25px;
    left: 2px;
    transform-origin: top center;
    transform: rotate(20deg);
    z-index: 10;
    box-shadow: 0 0 6px white;
}


.fireSword {
    position: absolute;
    width: 8px;
    height: 45px;
    background: orange;
    border-radius: 4px;
    top: 25px;
    left: 2px;
    transform-origin: top center;
    transform: rotate(20deg);
    z-index: 10;
    box-shadow: 0 0 10px orange, 0 0 20px red;
}


.lightningSword {
    position: absolute;
    width: 8px;
    height: 45px;
    background: #b0f7ff;
    border-radius: 4px;
    top: 25px;
    left: 2px;
    transform-origin: top center;
    transform: rotate(20deg);
    z-index: 10;
    box-shadow:
        0 0 8px #00eaff,
        0 0 16px #00c8ff,
        0 0 28px #00aaff,
        0 0 40px #0088ff;
}


/* ENEMIES */
.enemy, .redEnemy, .blueEnemy, .yellowEnemy, .superEnemy, .pinkEnemy {
    position: absolute;
    width: 10px;
    height: 60px;
}


.enemy { background: black; }
.redEnemy { background: red; }
.blueEnemy { background: blue; }
.yellowEnemy { background: yellow; }
.pinkEnemy { background: pink; }
.superEnemy { background: black; }


.enemy::before, .redEnemy::before, .blueEnemy::before, .yellowEnemy::before, .superEnemy::before, .pinkEnemy::before {
    content: "";
    position: absolute;
    top: -22px;
    left: -10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
}


.enemy::before { background: black; }
.redEnemy::before { background: red; }
.blueEnemy::before { background: blue; }
.yellowEnemy::before { background: yellow; }
.superEnemy::before { background: black; }
.pinkEnemy::before { background: pink; }


.enemyArm, .enemyLeg {
    position: absolute;
}


.enemyArm {
    width: 12px;
    height: 35px;
    border-radius: 10px;
    top: 20px;
}


.enemyLeftArm { left: -15px; }
.enemyRightArm { left: 13px; }


.enemyLeg {
    width: 8px;
    height: 40px;
    border-radius: 5px;
    top: 60px;
}


.enemyLeftLeg { left: -5px; }
.enemyRightLeg { left: 10px; }


.enemy .enemyArm, .enemy .enemyLeg { background: black; }
.redEnemy .enemyArm, .redEnemy .enemyLeg { background: red; }
.blueEnemy .enemyArm, .blueEnemy .enemyLeg { background: blue; }
.yellowEnemy .enemyArm, .yellowEnemy .enemyLeg { background: yellow; }
.superEnemy .enemyArm, .superEnemy .enemyLeg { background: black; }
.pinkEnemy .enemyArm, .pinkEnemy .enemyLeg { background: pink; }




.coin {
    position: absolute;
    width: 25px;
    height: 25px;
    background: gold;
    border-radius: 50%;
    border: 3px solid orange;
    box-shadow: 0 0 10px yellow;
}


</style>
</head>
